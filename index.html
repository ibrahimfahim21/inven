        c.save(); c.shadowColor = "rgba(0,0,0,.30)"; c.shadowBlur = 50; c.shadowOffsetY = 18; c.fillStyle = "#fff"; rr(c, 54, 206, 972, 1006, 48); c.fill(); c.restore();
        // هالة + صورة الصنف
        var rg = c.createRadialGradient(540, 500, 40, 540, 500, 300); rg.addColorStop(0, hexA(d.color, .20)); rg.addColorStop(1, hexA(d.color, 0));
        c.fillStyle = rg; c.beginPath(); c.arc(540, 500, 300, 0, 7); c.fill();
        c.fillStyle = hexA(d.color, .08); c.beginPath(); c.ellipse(540, 712, 210, 26, 0, 0, 7); c.fill();
        if (imgs[0]) c.drawImage(imgs[0], 540 - 235, 500 - 235, 470, 470);
        // الحالة
        if (d.status) {
            c.font = "800 32px Cairo, sans-serif"; var sw = c.measureText(d.status).width + 64;
            c.fillStyle = d.color; rr(c, 92, 246, sw, 66, 33); c.fill();
            c.fillStyle = "#fff"; c.textAlign = "center"; c.fillText(d.status, 92 + sw / 2, 291);
        }
        // الكود
        c.direction = "ltr"; c.textAlign = "center"; c.fillStyle = "#1C2536";
        c.fillText(fit(c, d.code, 880, 84, 50, 800), 540, 820);
        // الصنف والوصف
        c.direction = "rtl"; c.fillStyle = "#3A4A60";
        var td = [d.type, d.desc].filter(Boolean).join("  ·  ") || "—";
        c.fillText(fit(c, td, 880, 42, 28, 700), 540, 882);
        // المربعات
        var B = [["الموقع", d.loc || "—", 0], ["الرقم التسلسلي", d.serial || "—", 1], ["العدد", d.qty || "—", 0], ["تاريخ الجرد", d.date || "—", 1]];
        for (var i = 0; i < 4; i++) {
            var bx = (i % 2 === 0) ? 552 : 98, by = 924 + Math.floor(i / 2) * 140, bw = 430, bh = 120;
            c.fillStyle = "#F2F5F9"; rr(c, bx, by, bw, bh, 26); c.fill();
            c.fillStyle = hexA(d.color, .9); rr(c, bx + bw - 10, by + 26, 10, bh - 52, 5); c.fill();
            c.direction = "rtl"; c.textAlign = "right"; c.fillStyle = "#6E7A8F"; c.font = "700 26px Cairo, sans-serif"; c.fillText(B[i][0], bx + bw - 30, by + 46);
            c.fillStyle = "#1C2536";
            if (B[i][2]) { c.direction = "ltr"; }
            c.fillText(fit(c, String(B[i][1]), bw - 60, 38, 24, 800), bx + bw - 30, by + 96);
        }
        // الفوتر
        c.direction = "rtl"; c.textAlign = "center";
        c.fillStyle = "rgba(255,255,255,.92)"; c.font = "800 30px Cairo, sans-serif"; c.fillText("تصميم وتطوير: م. إبراهيم فهيم", 540, 1272);
        if (d.printed) { c.fillStyle = "#A9D9CD"; c.font = "600 22px Cairo, sans-serif"; c.fillText("بيانات الملصق بتاريخ " + d.printed, 540, 1314); }
        return cv;
    }

    async function main() {
        var d = null; try { d = decode(location.hash); } catch (e) { d = null; }
        if (!d) { document.getElementById("empty").style.display = "block"; document.getElementById("emptyIc").src = IMG.gen || ""; return; }
        document.title = d.code + " - بطاقة جرد";
        document.getElementById("view").style.display = "block";
        var cv = await draw(d), url = cv.toDataURL("image/png");
        document.getElementById("post").src = url;
        if (!CFG.buttons) return;
        var name = d.code + ".png", sv = document.getElementById("save"), sh = document.getElementById("share");
        sv.style.display = "block";
        sv.onclick = function () { var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
        cv.toBlob(function (b) {
            try {
                var file = new File([b], name, { type: "image/png" });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    sh.style.display = "block";
                    sh.onclick = function () { navigator.share({ files: [file], title: d.code }).catch(function () {}); };
                }
            } catch (e) {}
        }, "image/png");
        document.getElementById("hint").textContent = "أو اضغط مطولًا على الصورة";
    }
    window.addEventListener("hashchange", function () { location.reload(); });
    main();
    if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
})();
</script>
