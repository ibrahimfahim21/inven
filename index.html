        while (n > 0n) { bytes.unshift(Number(n & 255n)); n >>= 8n; }

        var s = new TextDecoder("utf-8").decode(new Uint8Array(bytes.slice(1)));
        var f = s.split("\x1f");
        function L(v, lst) { return (v && v.charAt(0) === "~") ? (lst[parseInt(v.slice(1), 36)] || "") : (v || ""); }
        function D(v) { return v && v.length === 6 ? "20" + v.slice(0, 2) + "-" + v.slice(2, 4) + "-" + v.slice(4, 6) : ""; }
        var code = f[0] || "";
        code = code.charAt(0) === "!" ? code.slice(1) : "INV-" + ("00000" + code).slice(-Math.max(5, code.length));
        var st = L(f[6], STATUS.map(function (x) { return x[0]; }));
        var stc = (STATUS.filter(function (x) { return x[0] === st; })[0] || [0, "#5B6B85"])[1];
        return { code: code, type: L(f[1], TYPES), desc: f[2] || "", loc: L(f[3], LOCS), serial: f[4] || "",
                 qty: f[5] === undefined || f[5] === "" ? "1" : (f[5] === "-" ? "" : f[5]), status: st, color: stc, date: D(f[7]), printed: D(f[8]) };
    }

    // صورة الصنف: الأصناف الأصلية برقمها، وأي صنف جديد بكلمة من اسمه، وإلا الصورة العامة
    function typeImg(t) {
        var i = TYPES.indexOf(t);
        if (i >= 0 && IMG["t" + ("0" + i).slice(-2)]) return IMG["t" + ("0" + i).slice(-2)];
        var K = [[/انتظار/, 10], [/كرسي|كراسي/, 1], [/مكتب|ترابيزة|طاولة/, 0], [/كمبيوتر|حاسب|لابتوب|لاب توب/, 2], [/شاشة|مونيتور/, 3], [/ثلاج|فريزر|براد/, 4],
                 [/تلفزيون|تلفاز|عرض/, 5], [/جهاز|طبي|مونيتر/, 6], [/طابع|برنتر|سكانر/, 7], [/مكيف|تكييف/, 8], [/سرير|نقالة/, 9], [/دولاب|خزان|خزانة|رف|أرفف/, 11]];
        for (var k = 0; k < K.length; k++) if (K[k][0].test(t || "")) return IMG["t" + ("0" + K[k][1]).slice(-2)];
        return IMG.gen;
    }

    function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
    function fit(c, txt, maxW, size, min, weight) {
        var s = size; c.font = weight + " " + s + "px Cairo, sans-serif";
        while (c.measureText(txt).width > maxW && s > min) { s -= 2; c.font = weight + " " + s + "px Cairo, sans-serif"; }
        if (c.measureText(txt).width > maxW) { while (txt.length > 1 && c.measureText(txt + "…").width > maxW) txt = txt.slice(0, -1); txt += "…"; }
        return txt;
    }
    function load(src) { return new Promise(function (ok) { if (!src) return ok(null); var im = new Image(); im.onload = function () { ok(im); }; im.onerror = function () { ok(null); }; im.src = src; }); }
    function hexA(h, a) { var n = parseInt(h.slice(1), 16); return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")"; }

    async function draw(d) {
        var W = 1080, H = 1350, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
        var c = cv.getContext("2d");
        try { await Promise.all(["700 40px Cairo", "600 40px Cairo"].map(function (f) { return document.fonts.load(f, "ابجد INV-0123"); })); } catch (e) {}
        var imgs = await Promise.all([load(typeImg(d.type)), load(IMG.org)]);
        // الخلفية
        var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0B3D37"); g.addColorStop(1, "#126356"); c.fillStyle = g; c.fillRect(0, 0, W, H);
        c.fillStyle = "rgba(255,255,255,.05)"; c.beginPath(); c.arc(980, 120, 260, 0, 7); c.fill(); c.beginPath(); c.arc(80, 1260, 220, 0, 7); c.fill();
        c.fillStyle = "rgba(255,255,255,.07)"; for (var yy = 30; yy < 200; yy += 26) for (var xx = 40; xx < 420; xx += 26) { c.beginPath(); c.arc(xx, yy, 2.2, 0, 7); c.fill(); }
        // الهيدر: اسم المجمع
        c.direction = "rtl"; c.textAlign = "right"; c.textBaseline = "alphabetic";
        var hx = W - 60;
        if (imgs[1]) { c.drawImage(imgs[1], W - 60 - 92, 66, 92, 92); hx = W - 60 - 92 - 22; }
        c.fillStyle = "#fff"; c.fillText(fit(c, CFG.org || "", hx - 70, 44, 28, 800), hx, 112);
        c.fillStyle = "#F2C14E"; c.font = "700 27px Cairo, sans-serif"; c.fillText("بطاقة أصل · جرد المحتويات", hx, 154);
        // الكارت الأبيض
        c.save(); c.shadowColor = "rgba(0,0,0,.30)"; c.shadowBlur = 50; c.shadowOffsetY = 18; c.fillStyle = "#fff"; rr(c, 54, 206, 972, 1006, 48); c.fill(); c.restore();
        // هالة + صورة الصنف
        var rg = c.createRadialGradient(540, 500, 40, 540, 500, 300); rg.addColorStop(0, hexA(d.color, .20)); rg.addColorStop(1, hexA(d.color, 0));
        c.fillStyle = rg; c.beginPath(); c.arc(540, 500, 300, 0, 7); c.fill();
        c.fillStyle = hexA(d.color, .08); c.beginPath(); c.ellipse(540, 712, 210, 26, 0, 0, 7); c.fill();
        if (imgs[0]) c.drawImage(imgs[0], 540 - 235, 500 - 235, 470, 470);
        // الحالة
        if (d.status) {
            c.font = "800 32px Cairo, sans-serif"; var sw = c.measureText(d.status).width + 64;
            c.fillStyle = d.color; rr(c, 92, 246, sw, 66, 33); c.fill();
            c.fillStyle = "#fff"; c.textAlign = "center"; c.fillText(d.status, 92 + sw / 2, 291);
        }
        // الكود
        c.direction = "ltr"; c.textAlign = "center"; c.fillStyle = "#1C2536";
        c.fillText(fit(c, d.code, 880, 84, 50, 800), 540, 820);
        // الصنف والوصف
        c.direction = "rtl"; c.fillStyle = "#3A4A60";
        var td = [d.type, d.desc].filter(Boolean).join("  ·  ") || "—";
        c.fillText(fit(c, td, 880, 42, 28, 700), 540, 882);
        // المربعات
        var B = [["الموقع", d.loc || "—", 0], ["الرقم التسلسلي", d.serial || "—", 1], ["العدد", d.qty || "—", 0], ["تاريخ الجرد", d.date || "—", 1]];
        for (var i = 0; i < 4; i++) {
            var bx = (i % 2 === 0) ? 552 : 98, by = 924 + Math.floor(i / 2) * 140, bw = 430, bh = 120;
            c.fillStyle = "#F2F5F9"; rr(c, bx, by, bw, bh, 26); c.fill();
            c.fillStyle = hexA(d.color, .9); rr(c, bx + bw - 10, by + 26, 10, bh - 52, 5); c.fill();
            c.direction = "rtl"; c.textAlign = "right"; c.fillStyle = "#6E7A8F"; c.font = "700 26px Cairo, sans-serif"; c.fillText(B[i][0], bx + bw - 30, by + 46);
            c.fillStyle = "#1C2536";
            if (B[i][2]) { c.direction = "ltr"; }
            c.fillText(fit(c, String(B[i][1]), bw - 60, 38, 24, 800), bx + bw - 30, by + 96);
        }
        // الفوتر
        c.direction = "rtl"; c.textAlign = "center";
        c.fillStyle = "rgba(255,255,255,.92)"; c.font = "800 30px Cairo, sans-serif"; c.fillText("تصميم وتطوير: م. إبراهيم فهيم", 540, 1272);
        if (d.printed) { c.fillStyle = "#A9D9CD"; c.font = "600 22px Cairo, sans-serif"; c.fillText("بيانات الملصق بتاريخ " + d.printed, 540, 1314); }
        return cv;
    }

    async function main() {
        var d = null; try { d = decode(location.hash); } catch (e) { d = null; }
        if (!d) { document.getElementById("empty").style.display = "block"; document.getElementById("emptyIc").src = IMG.gen || ""; return; }
        document.title = d.code + " - بطاقة جرد";
        document.getElementById("view").style.display = "block";
        var cv = await draw(d), url = cv.toDataURL("image/png");
        document.getElementById("post").src = url;
        if (!CFG.buttons) return;
        var name = d.code + ".png", sv = document.getElementById("save"), sh = document.getElementById("share");
        sv.style.display = "block";
        sv.onclick = function () { var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
        cv.toBlob(function (b) {
            try {
                var file = new File([b], name, { type: "image/png" });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    sh.style.display = "block";
                    sh.onclick = function () { navigator.share({ files: [file], title: d.code }).catch(function () {}); };
                }
            } catch (e) {}
        }, "image/png");
        document.getElementById("hint").textContent = "أو اضغط مطولًا على الصورة";
    }
    window.addEventListener("hashchange", function () { location.reload(); });
    main();
    if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
})();
</script>
